<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>中考诊断台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='6' height='14' rx='1' fill='%2324272c'/%3E%3Crect x='13' y='9' width='6' height='14' rx='1' fill='%2324272c'/%3E%3Crect x='23' y='9' width='6' height='14' rx='1' fill='none' stroke='%23b4474f' stroke-width='2'/%3E%3C/svg%3E">
<style>
/* 版式：答题卡。每个模块是一行“涂卡格”，四格代表四个难度层级；作答时选项是可涂的 [A] [B] [C] [D]。
   颜色：白纸、答题卡的淡红定位线、2B 铅笔的墨黑、钢笔蓝作为主操作色；对错用绿/红，与主色分开。 */
:root {
  --bg: #f3f4f1; --sheet: #ffffff; --sheet-2: #f7f8f5; --ink: #1c1f24; --muted: #5f6670; --line: #dde0da;
  --guide: #e9b9b9; --guide-ink: #b4474f;
  --accent: #1f4fa3; --accent-ink: #ffffff; --accent-soft: #e4ebf8;
  --pencil: #24272c;
  --good: #1e7a4c; --good-bg: #e3f2e9; --bad: #b7352f; --bad-bg: #fbe7e5; --warn: #9a6a00; --warn-bg: #fdf2d6; --mark: #fff0a8;
  --s-yw: #b4474f; --s-sx: #1f4fa3; --s-yy: #7a4fb0; --s-wl: #0f7d8c; --s-hx: #3c8a3a; --s-df: #b86a12; --s-ls: #8a5a3c;
  --font-display: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
  --font-num: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --sheet: #1b1e22; --sheet-2: #22262b; --ink: #e8eaed; --muted: #a2a8b1; --line: #33383f;
  --guide: #5a3438; --guide-ink: #e48b91;
  --accent: #7ea6f0; --accent-ink: #0c1830; --accent-soft: #1f2b44;
  --pencil: #e8eaed;
  --good: #63c991; --good-bg: #16352a; --bad: #f08a83; --bad-bg: #3d1f1f; --warn: #e2b657; --warn-bg: #3a2f12; --mark: #5c4f14;
  --s-yw: #e48b91; --s-sx: #7ea6f0; --s-yy: #b99be6; --s-wl: #5cc6d3; --s-hx: #82c87f; --s-df: #e6a65a; --s-ls: #cfa07f;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121417; --sheet: #1b1e22; --sheet-2: #22262b; --ink: #e8eaed; --muted: #a2a8b1; --line: #33383f;
  --guide: #5a3438; --guide-ink: #e48b91;
  --accent: #7ea6f0; --accent-ink: #0c1830; --accent-soft: #1f2b44;
  --pencil: #e8eaed;
  --good: #63c991; --good-bg: #16352a; --bad: #f08a83; --bad-bg: #3d1f1f; --warn: #e2b657; --warn-bg: #3a2f12; --mark: #5c4f14;
  --s-yw: #e48b91; --s-sx: #7ea6f0; --s-yy: #b99be6; --s-wl: #5cc6d3; --s-hx: #82c87f; --s-df: #e6a65a; --s-ls: #cfa07f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.25; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 36px); letter-spacing: .02em; }
h2 { font-size: 21px; } h3 { font-size: 18px; }
p { margin: 0; } button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.small { font-size: 14px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--guide-ink); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 2px solid var(--guide); }
.top-in { max-width: 1080px; margin: 0 auto; min-height: 58px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; text-decoration: none; color: var(--ink); flex: 1 1 auto; min-width: 0; display: flex; gap: 10px; align-items: baseline; white-space: nowrap; }
@media (max-width: 520px) { .brand small { display: none; } .nav { width: 100%; justify-content: space-between; } .nav a { padding: 6px 10px; } }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--muted); font-size: 15px; padding: 6px 12px; border-radius: 6px; }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 700; }
main.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 72px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.sheet > header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-weight: 700; font-size: 16px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.big { font-size: 18px; padding: 13px 26px; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
@media (hover: hover) { .btn:not([disabled]):hover { border-color: var(--accent); } }
.lede { color: var(--muted); font-size: 17px; max-width: 62ch; }
.hello { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }

/* 答题卡：模块行与四个层级格 */
.subj { border-top: 3px solid var(--subj, var(--accent)); }
.subj-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.subj-head h2 { color: var(--subj, var(--ink)); }
.mods { list-style: none; margin: 0; padding: 0; }
.mod { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-top: 1px dashed var(--guide); }
.mod:first-child { border-top: 0; }
.mod .nm { font-weight: 700; } .mod .sub { font-size: 13px; color: var(--muted); grid-column: 1 / 2; }
.cells { display: inline-grid; grid-template-columns: repeat(4, 26px); gap: 4px; }
.cells i { height: 18px; border: 1.5px solid var(--guide); border-radius: 3px; position: relative; }
.cells i.on { background: var(--pencil); border-color: var(--pencil); }
.cells i.half { background: repeating-linear-gradient(135deg, var(--pencil) 0 3px, transparent 3px 6px); border-color: var(--pencil); }
.cells-legend { display: inline-grid; grid-template-columns: repeat(4, 26px); gap: 4px; font-size: 11px; color: var(--guide-ink); text-align: center; }
.pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--sheet-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-bg); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }

/* 作答 */
.run-head { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 16px; }
.run-head .title { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.run-head .title strong { font-family: var(--font-display); font-size: 20px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; max-width: 260px; }
.steps i { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid var(--guide); }
.steps i.ok { background: var(--good); border-color: var(--good); } .steps i.no { background: var(--bad); border-color: var(--bad); }
.run-body { display: grid; gap: 20px; align-items: start; }
.run-body.has-passage { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.passage-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 92px); overflow: auto; }
.passage { font-size: 18px; line-height: 1.85; }
.passage h3 { margin-bottom: 10px; }
.passage p + p { margin-top: .9em; }
.passage.en { font-family: Georgia, "Times New Roman", var(--font-body); line-height: 1.7; }
.qcard { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-width: 780px; }
.q-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.q-stem { font-size: 18px; padding: 12px 16px; background: var(--sheet-2); border-left: 3px solid var(--guide); border-radius: 0 8px 8px 0; overflow-x: auto; }
.q-prompt { font-size: 19px; font-weight: 700; line-height: 1.55; }
.q-fig { max-width: min(100%, 420px); color: var(--ink); }
.q-fig svg { width: 100%; height: auto; display: block; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--sheet); font-size: 18px; line-height: 1.5; cursor: pointer; }
.choice .bub { flex: none; min-width: 34px; height: 24px; margin-top: 2px; display: grid; place-items: center; border: 1.5px solid var(--guide-ink); color: var(--guide-ink);
  border-radius: 3px; font: 700 13px var(--font-num); letter-spacing: .05em; }
.choice[aria-pressed="true"] { border-color: var(--pencil); }
.choice[aria-pressed="true"] .bub { background: var(--pencil); border-color: var(--pencil); color: var(--sheet); }
.choice.right { border-color: var(--good); background: var(--good-bg); } .choice.right .bub { background: var(--good); border-color: var(--good); color: var(--sheet); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); } .choice.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.choice[disabled] { cursor: default; }
@media (hover: hover) { .choice:not([disabled]):hover { border-color: var(--accent); } }
sup, sub { font-size: .72em; line-height: 0; }
u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.blank { display: inline-block; min-width: 3.2em; border-bottom: 1.5px solid currentColor; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.feedback { border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.feedback.ok { background: var(--good-bg); } .feedback.no { background: var(--bad-bg); }
.feedback .verdict { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.feedback.ok .verdict { color: var(--good); } .feedback.no .verdict { color: var(--bad); }
.q-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.notice { font-size: 15px; color: var(--muted); padding: 10px 14px; border-radius: 8px; background: var(--sheet-2); border: 1px solid var(--line); }
.notice.warn { background: var(--warn-bg); border-color: transparent; color: var(--ink); }
.wave { display: flex; gap: 5px; align-items: center; height: 40px; }
.wave i { width: 6px; height: 10px; border-radius: 3px; background: var(--accent); }
.wave.on i { animation: wave 1s ease-in-out infinite; }
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wave { 0%,100% { height: 10px; } 50% { height: 36px; } }

/* 复盘与家长 */
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.review li { padding: 14px 0; border-top: 1px dashed var(--guide); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.review li:first-child { border-top: 0; }
.review .ans { font-size: 15px; }
.review .why { font-size: 15px; color: var(--muted); }
.code-box { font: 13px/1.5 var(--font-num); word-break: break-all; background: var(--sheet-2); border: 1px dashed var(--guide-ink); border-radius: 8px; padding: 12px; user-select: all; max-height: 180px; overflow: auto; }
textarea.paste { width: 100%; min-height: 110px; font: 13px/1.5 var(--font-num); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); font-size: 16px; width: 100%; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.score-big { font-family: var(--font-display); font-size: 54px; font-weight: 700; line-height: 1; color: var(--accent); }
.ladder { display: flex; flex-direction: column; gap: 6px; }
.rung { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 14px; padding: 7px 10px; border-radius: 6px; background: var(--sheet-2); }
.rung.reach { background: var(--good-bg); }
.rung .gap { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.prio { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: p; }
.prio li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; counter-increment: p; }
.prio li::before { content: counter(p); font: 700 15px var(--font-num); color: var(--guide-ink); border: 1.5px solid var(--guide); border-radius: 3px; text-align: center; height: 26px; line-height: 23px; }
.prio .gain { font: 700 15px var(--font-num); color: var(--good); white-space: nowrap; }
.kps { display: flex; flex-wrap: wrap; gap: 6px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1.5px solid var(--guide); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px dashed var(--line); vertical-align: top; }
td.num, th.num { text-align: right; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.confirm { border: 2px solid var(--bad); }
.empty { color: var(--muted); padding: 16px; border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 860px) { .grid2, .run-body.has-passage { grid-template-columns: minmax(0, 1fr); } .passage-col { position: static; max-height: none; overflow: visible; } }
@media (max-width: 520px) { body { font-size: 16px; } .sheet { padding: 16px; } .choice { font-size: 17px; padding: 11px 12px; } .q-prompt { font-size: 18px; }
  .mod { grid-template-columns: minmax(0, 1fr) auto; } .mod .act { grid-column: 1 / -1; justify-self: start; } .cells { grid-template-columns: repeat(4, 22px); } .cells-legend { grid-template-columns: repeat(4, 22px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
